# Local development: the web app and PostgreSQL.
#   docker compose up --build -d   -> http://localhost:8080
# Data is kept in the "postgres-data" named volume. "docker compose down" keeps
# it; only "docker compose down -v" deletes it.
# Values below are local-only defaults; override them in a .env file
# (see .env.example).
name: enteksis-assessment

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enteksis}
      POSTGRES_USER: ${POSTGRES_USER:-enteksis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during first-time initialisation PostgreSQL runs a
      # temporary server that only accepts socket connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-enteksis};Username=${POSTGRES_USER:-enteksis};Password=${POSTGRES_PASSWORD:-local-dev-password}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # The app exits with code 1 if the database is unreachable at startup;
    # Docker then starts it again until the database is back.
    restart: on-failure

volumes:
  postgres-data:
