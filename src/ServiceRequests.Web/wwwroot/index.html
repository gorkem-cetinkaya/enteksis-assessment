<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otomasyon talebi</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Otomasyon talebi gönderin</h1>
    <p>E-posta ile Excel arasında elle taşıdığınız müşteri taleplerini anlatın; uygun otomasyonu birlikte belirleyelim.</p>

    <p class="demo-notice" id="demo-notice">Demo uygulamadır. Yalnızca kurgusal bilgiler kullanın.</p>

    <noscript>
      <p class="form-alert">Formu göndermek için tarayıcınızda JavaScript açık olmalıdır.</p>
    </noscript>

    <!-- method="post" keeps the entered values out of the URL even if the script fails to load. -->
    <form id="request-form" method="post" action="/api/requests" novalidate aria-describedby="demo-notice">
      <div class="field">
        <label for="name">Ad soyad</label>
        <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
        <p class="field-error" id="name-error" hidden></p>
      </div>

      <div class="field">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" required
               aria-describedby="email-error">
        <p class="field-error" id="email-error" hidden></p>
      </div>

      <div class="field">
        <label for="service">Hizmet</label>
        <select id="service" name="service" required aria-describedby="service-error">
          <option value="">Bir hizmet seçin</option>
          <option value="workflow-automation">İş akışı otomasyonu</option>
          <option value="api-integration">API ve veri entegrasyonu</option>
          <option value="ai-triage">AI destekli talep sınıflandırma</option>
        </select>
        <p class="field-error" id="service-error" hidden></p>
      </div>

      <div class="field">
        <label for="description">Açıklama</label>
        <p class="field-hint" id="description-hint">10–2000 karakter. Hangi işi, ne sıklıkla elle yaptığınızı yazın.</p>
        <textarea id="description" name="description" rows="6" required
                  aria-describedby="description-hint description-error"></textarea>
        <p class="field-error" id="description-error" hidden></p>
      </div>

      <button type="submit" id="submit-button">Talebi gönder</button>

      <p class="form-status" id="form-status" role="status" tabindex="-1"></p>
      <p class="form-alert" id="form-alert" role="alert" tabindex="-1"></p>
    </form>
  </main>
</body>
</html>
